<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
  </defs>

  <!-- Outer Ambient Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#glowGrad)" opacity="0.3" filter="blur(3px)" />

  <!-- Shield Shape -->
  <path d="M32 4L10 13.5V30.5C10 44.2 19.3 56.5 32 60C44.7 56.5 54 44.2 54 30.5V13.5L32 4Z" 
        fill="url(#shieldGrad)" 
        stroke="#34d399" 
        stroke-width="2" 
        stroke-linejoin="round" />

  <!-- Inner Protective Border -->
  <path d="M32 8L14 15.8V29.8C14 41.2 21.6 51.5 32 55.2C42.4 51.5 50 41.2 50 29.8V15.8L32 8Z" 
        fill="#042f2e" 
        fill-opacity="0.65" 
        stroke="#10b981" 
        stroke-width="1" 
        stroke-dasharray="2 2" />

  <!-- Medical Cross Symbol -->
  <rect x="28" y="19" width="8" height="24" rx="2" fill="url(#crossGrad)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))" />
  <rect x="20" y="27" width="24" height="8" rx="2" fill="url(#crossGrad)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))" />

  <!-- Molecular Safety Nodes / Nodes of Intelligence -->
  <circle cx="20" cy="20" r="2.5" fill="#a7f3d0" />
  <circle cx="44" cy="20" r="2.5" fill="#a7f3d0" />
  <circle cx="32" cy="46" r="2.5" fill="#6ee7b7" />
  <line x1="20" y1="20" x2="28" y2="23" stroke="#6ee7b7" stroke-width="1.2" stroke-opacity="0.8" />
  <line x1="44" y1="20" x2="36" y2="23" stroke="#6ee7b7" stroke-width="1.2" stroke-opacity="0.8" />
  <line x1="32" y1="43" x2="32" y2="46" stroke="#6ee7b7" stroke-width="1.2" stroke-opacity="0.8" />
</svg>
